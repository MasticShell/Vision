name: Vision CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qpdf libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev clang libclang-dev pkg-config

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install Node dependencies
      run: npm ci

    - name: Build frontend assets for Rust tests
      run: npm run build

    - name: Rust Format Check
      run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

    - name: Rust Clippy
      run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

    - name: Run Rust tests
      run: cargo test --manifest-path src-tauri/Cargo.toml --verbose
